[project]
name = "facerecserver"
version = "0.1.0"
description = "Face recognition streaming server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "face-recognition>=1.3.0",
    "face-recognition-models",
    "flask>=3.1.3",
    "flask-socketio>=5.6.1",
    "numpy>=2.4.0",
    "opencv-contrib-python-headless>=4.10.0",
    "setuptools>=82.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
face-recognition-models = { git = "https://github.com/ageitgey/face_recognition_models" }
