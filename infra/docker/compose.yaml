services:
  models:
    image: ${MODELS_IMAGE:-facerecserver-models:local}
    restart: "no"
    volumes:
      - models-data:/shared-models

  app:
    image: ${APP_IMAGE:-facerecserver-app:local}
    depends_on:
      models:
        condition: service_completed_successfully
    environment:
      FACEREC_PORT: "8080"
      FACEREC_ENABLE_TLS: ${FACEREC_ENABLE_TLS:-0}
      FACEREC_REQUIRE_TLS: ${FACEREC_REQUIRE_TLS:-0}
      FACEREC_TLS_CERT: ${FACEREC_TLS_CERT:-/app/certificates/certificate.crt}
      FACEREC_TLS_KEY: ${FACEREC_TLS_KEY:-/app/certificates/private.key}
    ports:
      - "8080:8080"
    volumes:
      - models-data:/app/model
      - ${FACEREC_CERTIFICATES_DIR:-./certificates}:/app/certificates:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.getenv(\"FACEREC_PORT\", \"8080\")}/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  models-data:
